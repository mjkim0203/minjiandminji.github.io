<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face & Object Detection</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333;
        }
        #videoContainer {
            position: relative;
            border: 2px solid white;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        video {
            display: block; 
        }
        
        /* [⭐ 이 부분이 빠졌습니다] */
        #loadingMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
            display: none; /* JS에서 표시/숨김 */
        }
    </style>
</head>
<body>
    <div id="videoContainer">
        <video id="video" width="720" height="560" autoplay muted playsinline></video>
        
        <!-- [⭐ 이 부분이 빠졌습니다] -->
        <div id="loadingMessage">AI 모델을 로드 중입니다...</div>
    </div>

    <!-- 라이브러리 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

    <!-- 
      .then()으로 수정된 최신 script.js
      (이 파일은 이미 가지고 계신 코드를 사용하면 됩니다)
    -->
    <script src="script.js"></script>
</body>
</html>
