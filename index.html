<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>구형 iMac 테스트 (clmtrackr)</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        #container {
            position: relative;
            border: 2px solid white;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        #message {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #FFFF00;
            font-size: 24px;
            padding: 10px;
            border-radius: 5px;
            z-index: 10;
        }
    </style>
</head>
<body>
    
    <div id="container">
        <video id="video" width="640" height="480" autoplay muted playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
        <div id="message">얼굴을 찾는 중...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/clmtrackr@1.1.2/build/clmtrackr.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/clmtrackr@1.1.2/models/model_pca_20_svm.js" defer></script>
    <script src="https://cdn.jsdelivr.net/gh/auduno/clmtrackr/examples/js/emotion_classifier.js" defer></script>
    <script src="https://cdn.jsdelivr.net/gh/auduno/clmtrackr/examples/js/emotionmodel.js" defer></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const messageEl = document.getElementById('message');

        // [⭐ 수정됨] 'defer'가 작동하려면 코드가 바로 실행되면 안 됩니다.
        // 비디오가 켜지는 시점을 기준으로 모든 것을 시작하도록 변경합니다.
        
        // 1. 웹캠 시작
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
                video.srcObject = stream;
                video.play();
                // 비디오가 재생되면 -> 모델 초기화 및 추적 시작
                video.addEventListener('playing', startApp);
            })
            .catch(function(err) {
                console.error("웹캠 오류:", err);
                messageEl.innerText = "웹캠을 찾을 수 없습니다.";
            });

        // 2. 앱 메인 로직
        function startApp() {
            // 이 시점에는 defer된 스크립트가 모두 로드되었어야 합니다.
            try {
                // 2-1. 얼굴 추적기(Tracker) 초기화
                const ctracker = new clmtrackr.tracker({
                    model: pModel 
                });
                ctracker.init(pModel);
                ctracker.start(video);
                
                // 2-2. 표정 분류기(Emotion Classifier) 초기화
                const myClassifier = new emotionClassifier(); 
                myClassifier.init(emotionModel); 

                // 2-3. 그리기 루프 시작
                drawLoop(ctracker, myClassifier);
                
            } catch (err) {
                // defer로도 clmtrackr을 못 찾는 경우
                console.error("라이브러리 초기화 실패:", err);
                messageEl.innerText = "라이브러리 로드에 실패했습니다.";
            }
        }

        // 3. 그리기 루프
        function drawLoop(ctracker, myClassifier) {
            requestAnimationFrame(() => drawLoop(ctracker, myClassifier)); // 재귀 호출

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const positions = ctracker.getCurrentPosition();

            if (positions) {
                ctracker.draw(canvas);
                const emotionData = myClassifier.getEmotion(ctracker.getCurrentParameters()); 
                
                if (emotionData && emotionData.emotion) {
                    let topEmotion = "";
                    let maxScore = 0;
                    for (let i = 0; i < emotionData.emotions.length; i++) {
                        if (emotionData.emotions[i].value > maxScore) {
                            maxScore = emotionData.emotions[i].value;
                            topEmotion = emotionData.emotions[i].emotion;
                        }
                    }
                    updateMessage(topEmotion);
                } else {
                    messageEl.innerText = "얼굴 추적 중...";
                }
            } else {
                messageEl.innerText = "얼굴을 찾는 중... (천천히 움직여주세요)";
            }
        }
        
        // 4. 문구 업데이트
        function updateMessage(emotion) {
            switch (emotion) {
                case 'happy':
                    messageEl.innerText = '즐거워 보이네요!';
                    break;
                case 'sad':
                    messageEl.innerText = '슬퍼 보입니다.';
                    break;
                case 'angry':
                    messageEl.innerText = '화가 났나요?';
                    break;
                case 'surprised':
                    messageEl.innerText = '놀란 표정이네요!';
                    break;
                default:
                    messageEl.innerText = '표정을 읽는 중...';
            }
        }
    </script>
</body>
</html>
